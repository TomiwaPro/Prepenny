name: Bank holidays

# Two jobs (D57, D537):
#
# - "Download the list": downloads GOV.UK's bank holiday list into
#   packages/engine/data, unchanged, with a small file beside it giving the
#   source link and the date downloaded: the copy built into the app, which
#   phones use with no signal. Commits only when the list has changed, back
#   to the branch it ran on. Runs once a pull request is ready for review,
#   not on every push, to save GitHub's minutes (D300), or by hand on any
#   branch but main. A commit made here doesn't start the checks itself
#   (GitHub's rule for its own key); they run on it after merging, on main,
#   before anything goes live.
#
# - "Keep the site's list up to date": every Monday morning, or by hand on
#   main, compares GOV.UK's list with the one on prepenny.co.uk, which
#   phones fetch each week (step 4c). When GOV.UK's has changed, it puts the
#   live app online again with the Deploy workflow, which gets GOV.UK's
#   newest list as it does: the same commit that's live, the newest on main
#   whose checks passed, so nothing but the list changes. A new bank
#   holiday then reaches phones within about a week, with no update to
#   PrePenny.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  schedule:
    # Mondays at 6:23am UTC.
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bank-holidays-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Not on main, which only changes through pull requests. Not on drafts,
    # nor on other people's copies, which can't push back.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Check out the branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1

      - name: Download the list from GOV.UK
        run: |
          curl --fail --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/bank-holidays.json" \
            https://www.gov.uk/bank-holidays.json
          echo "Downloaded $(wc -c < "$RUNNER_TEMP/bank-holidays.json") bytes."

      - name: Check it's valid JSON with all three nations
        run: |
          jq -e '
            . as $root
            | type == "object"
              and (["england-and-wales", "scotland", "northern-ireland"]
                   | all(. as $nation
                         | ($root[$nation].events | type == "array" and length > 0)
                           and all($root[$nation].events[];
                                   (.date | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")))))
          ' "$RUNNER_TEMP/bank-holidays.json"

      - name: Save it and commit if it changed
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          data=packages/engine/data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            mkdir -p "$data"
            cp "$RUNNER_TEMP/bank-holidays.json" "$data/bank-holidays.json"
            if [ -z "$(git status --porcelain -- "$data/bank-holidays.json")" ]; then
              echo "The list hasn't changed, so there's nothing to commit."
              exit 0
            fi
            today=$(TZ=Europe/London date +%F)
            sha=$(sha256sum "$data/bank-holidays.json" | cut -d' ' -f1)
            jq -n --arg today "$today" --arg sha "$sha" \
              '{source: "https://www.gov.uk/bank-holidays.json", downloaded_on: $today, sha256: $sha}' \
              > "$data/bank-holidays.source.json"
            git add "$data/bank-holidays.json" "$data/bank-holidays.source.json"
            git commit -m "Update the bank holiday list from GOV.UK ($today)"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "The push was refused, probably because the branch moved on. Trying again on its latest commit."
            git fetch --depth=1 origin "$BRANCH"
            git reset --hard FETCH_HEAD
            sleep 5
          done
          echo "Couldn't push after 3 tries." >&2
          exit 1

  keep-the-site-up-to-date:
    name: Keep the site's list up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      actions: write
      contents: read
    steps:
      - name: Download the list from GOV.UK
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 60 \
            --output "$RUNNER_TEMP/bank-holidays.json" \
            https://www.gov.uk/bank-holidays.json
          echo "Downloaded $(wc -c < "$RUNNER_TEMP/bank-holidays.json") bytes."

      - name: Check it's valid JSON with all three nations
        run: |
          jq -e '
            . as $root
            | type == "object"
              and (["england-and-wales", "scotland", "northern-ireland"]
                   | all(. as $nation
                         | ($root[$nation].events | type == "array" and length > 0)
                           and all($root[$nation].events[];
                                   (.date | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")))))
          ' "$RUNNER_TEMP/bank-holidays.json" > /dev/null

      - name: Put the live app online again if GOV.UK's list has changed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gov=$(sha256sum "$RUNNER_TEMP/bank-holidays.json" | cut -d' ' -f1)
          live=$(curl --fail --silent --max-time 30 https://prepenny.co.uk/bank-holidays.json | jq -r '.sha256 // empty' || true)
          if [ "$gov" = "$live" ]; then
            echo "The site already has GOV.UK's list, so there's nothing to do."
            exit 0
          fi
          # The newest commit on main whose checks passed: the one that's live.
          commit=$(gh run list --repo "$REPO" --workflow check.yml --branch main --event push \
            --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$commit" ]; then
            echo "::error title=Nothing to put online::No commit on main has passed its checks yet."
            exit 1
          fi
          echo "GOV.UK's list has changed (${live:-none on the site} to $gov). Putting ${commit::7} online again with it."
          gh workflow run deploy.yml --repo "$REPO" --ref main -f commit="$commit"
