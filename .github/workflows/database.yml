name: Database

# Sends the database changes in supabase/migrations to PrePenny's real
# Supabase project in London (step 3a, D297), then the get-back-in function
# (step 3e hardening), then its sign-in settings (step 3b, D305), once it has
# checked its key has every permission all that needs (step 3e-2, D406):
# - only from main, and only after the Check workflow has passed on that exact
#   commit, database tests included, as the live app does (D175)
# - or by hand from main.
# Only the migrations go: never seed.sql, the tests or their made-up people.
#
# Needs three secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and
# SUPABASE_DB_PASSWORD. See "The database" in README.md. Until they're added,
# it says plainly that nothing was changed. For signing in it also uses
# RESEND_API_KEY, GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET when they're there
# (README.md, "Signing in"), and says what's still missing.

on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database
  cancel-in-progress: false

defaults:
  run:
    # bash -eo pipefail: a failing command fails its step, even inside a pipe.
    shell: bash

jobs:
  apply:
    name: Change the real database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    steps:
      - name: Check out the code
        uses: actions/checkout@v5
        with:
          # Exactly the commit the checks passed on.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node (the version in .node-version)
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          # This job doesn't use pnpm, so nothing of pnpm's to keep.
          package-manager-cache: false

      - name: Set up the Supabase command line (2.122.0, as in the Check workflow)
        run: npm install --global supabase@2.122.0

      - name: Check Supabase is set up
        id: supabase
        env:
          HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_REF: ${{ secrets.SUPABASE_PROJECT_REF != '' }}
          HAS_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_REF" != "true" ] || [ "$HAS_PASSWORD" != "true" ]; then
            echo "::warning title=Database not changed::Supabase isn't set up yet, so the real database wasn't changed. Follow 'The database' in README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the key has every permission this run needs, before anything changes
        # Step 3e-2 (D406): each permission is tried with a call that needs it
        # and changes nothing. Missing any, the run stops here with one
        # message listing all of them, as Supabase's token page names them.
        if: steps.supabase.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          KEY_NAME: SUPABASE_ACCESS_TOKEN
          PROJECT_NAME: prepenny
        run: node scripts/check-supabase-key.ts

      - name: Connect to the project
        if: steps.supabase.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if ! supabase link --project-ref "$SUPABASE_PROJECT_REF"; then
            echo "::error title=Couldn't reach the database::Check the three secrets in README.md, 'The database'. A free project pauses after a week without use: open it on supabase.com and choose Restore project, then run this workflow again."
            exit 1
          fi

      - name: Show what will change
        if: steps.supabase.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # --linked: the real project from the step above. The command line
        # warns that its next version will aim at the local database unless
        # told, so it's said every time. Its version stays pinned (D297).
        run: supabase db push --linked --dry-run

      - name: Change the real database
        if: steps.supabase.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked

      - name: Put the get-back-in function online
        # Step 3e hardening: getting back in with a backup email finishes
        # through Supabase's own admin route, from a small function Supabase
        # runs (supabase/functions/get-back-in), straight after the database
        # it calls. Supabase gives it the project's own secret key; putting it
        # online needs GitHub's Supabase key to have Edge Functions:
        # Read-write (README.md, "The database"). Anyone can call it, signed in or not
        # (--no-verify-jwt, as supabase/config.toml says): the database
        # decides what each code does. Bundled on Supabase's side (--use-api).
        if: steps.supabase.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy get-back-in --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api

      - name: Check the Data API shows PrePenny's public part only
        # The Data API (PostgREST) answers for the schemas listed in the
        # project's Data API settings. PrePenny's checks live in `app`, which
        # must never be on that list: only `public`, where every table has its
        # privacy rules, and Supabase's own `graphql_public` (step 3c). The key
        # can read these settings; it tries to take `app` off if it's ever
        # there, and says exactly what to do by hand when Supabase refuses.
        if: steps.supabase.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/data-api.json" --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/postgrest" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error title=Data API settings::Supabase answered $status when asked for them: $(jq -r '.message // .msg // "no message"' "$RUNNER_TEMP/data-api.json")"
            exit 1
          fi
          schemas=$(jq -r '.db_schema' "$RUNNER_TEMP/data-api.json")
          echo "The Data API shows: $schemas"
          if tr ',' '\n' <<< "$schemas" | tr -d ' ' | grep -qx 'app'; then
            fixed=$(tr ',' '\n' <<< "$schemas" | tr -d ' ' | grep -vx 'app' | paste -sd, -)
            status=$(jq -n --arg schemas "$fixed" '{db_schema: $schemas}' | curl --silent --show-error \
              --output "$RUNNER_TEMP/answer.json" --write-out '%{http_code}' --request PATCH \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/postgrest" \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header "Content-Type: application/json" --data @-)
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error title=The Data API shows app::Take it off by hand: on supabase.com open the project, then Project Settings, Data API, and under Exposed schemas remove app, keeping public and graphql_public. Then run this workflow again."
              exit 1
            fi
            echo "The Data API showed app, and it has been taken off. It now shows: $fixed"
          fi
          if ! tr ',' '\n' <<< "$schemas" | tr -d ' ' | grep -qx 'public'; then
            echo "::warning title=Data API settings::public isn't on the Data API's list, so the app can't save plans. On supabase.com: Project Settings, Data API, Exposed schemas: add public."
          fi

      - name: Set the sign-in settings
        # Every setting is in supabase/sign-in-settings.json, with the sign-in
        # email from supabase/templates. The secrets come only from GitHub,
        # straight to Supabase: they're never printed. Supabase's own answer
        # is printed only when it refuses, and then only its message.
        if: steps.supabase.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          # The sign-in email, and since step 3e the email for changing the
          # address, sent to the address now and to the new one, each with its code.
          settings=$(jq --rawfile email supabase/templates/sign-in-code.html \
            --rawfile change supabase/templates/email-change.html \
            '. + {mailer_templates_confirmation_content: $email, mailer_templates_magic_link_content: $email,
              mailer_templates_email_change_content: $change}' \
            supabase/sign-in-settings.json)
          if [ -n "$RESEND_API_KEY" ]; then
            # Sign-in emails from hello@prepenny.co.uk, sent by Resend (D56),
            # with Supabase's own limits: a new code for one address once a
            # minute, and 30 emails an hour in all, which Supabase lets a
            # project change only once it sends its own emails.
            settings=$(jq --arg key "$RESEND_API_KEY" '. + {smtp_host: "smtp.resend.com", smtp_port: "465",
              smtp_user: "resend", smtp_pass: $key, smtp_admin_email: "hello@prepenny.co.uk",
              smtp_sender_name: "PrePenny", smtp_max_frequency: 60, rate_limit_email_sent: 30}' <<< "$settings")
          else
            echo "::warning title=Sign-in emails::RESEND_API_KEY isn't set yet, so Supabase's own test sender sends sign-in emails, only to its team. Follow 'Signing in' in README.md."
          fi
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            settings=$(jq --arg id "$GOOGLE_CLIENT_ID" --arg secret "$GOOGLE_CLIENT_SECRET" \
              '. + {external_google_enabled: true, external_google_client_id: $id, external_google_secret: $secret}' \
              <<< "$settings")
          else
            settings=$(jq '. + {external_google_enabled: false}' <<< "$settings")
            echo "::warning title=Google sign-in::GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET aren't set yet, so Continue with Google is off. Follow 'Signing in' in README.md."
          fi
          change() {
            curl --silent --show-error --output "$RUNNER_TEMP/answer.json" --write-out '%{http_code}' \
              --request PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header "Content-Type: application/json" \
              --data @-
          }
          status=$(change <<< "$settings")
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error title=Sign-in settings refused::Supabase answered $status: $(jq -r '.message // .msg // "no message"' "$RUNNER_TEMP/answer.json")"
            exit 1
          fi
          echo "The sign-in settings are set."
          # Signed out after 90 days without opening PrePenny (D19). Supabase
          # allows it only on its paid plan, so until then it's refused, and
          # it switches on by itself the first time this runs after the move.
          status=$(change <<< '{"sessions_inactivity_timeout": 2160}')
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::notice title=90-day sign-out::Not on yet: it needs Supabase's paid plan. Supabase said: $(jq -r '.message // .msg // "no message"' "$RUNNER_TEMP/answer.json")"
          else
            echo "Signed out after 90 days without opening PrePenny: on."
          fi

      - name: Let the database send PrePenny's own emails
        # Step 3e: the codes for a backup email, and getting back in with it,
        # are sent by the database itself (pg_net), through Resend, from
        # hello@prepenny.co.uk, as the sign-in emails are. The key goes
        # straight from GitHub's RESEND_API_KEY into Supabase's Vault, through
        # the Supabase key this workflow has; it's never printed. Until it's
        # set, backup emails say they aren't switched on yet.
        if: steps.supabase.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning title=Backup emails::RESEND_API_KEY isn't set yet, so backup emails can't be added or used. Follow 'Signing in' in README.md."
            exit 0
          fi
          # Only the characters a Resend key has, so it can be written into the query as it is.
          if ! [[ "$RESEND_API_KEY" =~ ^re_[A-Za-z0-9_]+$ ]]; then
            echo "::error title=Backup emails::RESEND_API_KEY doesn't look like a Resend key (it starts with re_). Check it in GitHub's secrets."
            exit 1
          fi
          status=$(jq -n --arg query "select app.use_resend('$RESEND_API_KEY');" '{query: $query}' | curl --silent --show-error \
            --output "$RUNNER_TEMP/answer.json" --write-out '%{http_code}' --request POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header "Content-Type: application/json" --data @-)
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error title=Backup emails::Supabase answered $status. Follow 'If the backup email step fails' in README.md, 'Signing in'."
            exit 1
          fi
          echo "PrePenny's own emails go through Resend."
