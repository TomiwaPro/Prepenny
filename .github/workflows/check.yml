name: Check

# Lint, type checks and tests on every push and pull request (brief 7.1).

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up pnpm (the version in package.json)
        uses: pnpm/action-setup@v4

      - name: Set up Node (the version in .node-version)
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type checks
        run: pnpm typecheck

      - name: Tests
        run: pnpm test
