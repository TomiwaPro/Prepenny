name: Check

# Every check, run once for each commit (step 3b, D300):
# - on a pull request, every push: lint, type checks, unit tests and the
#   database tests. While the pull request is a draft, that's all.
# - once the pull request is ready for review: the end-to-end tests too, on
#   every push from then on. "Ready for review" itself starts them in the
#   "End-to-end when ready" workflow (ready.yml), so they never wait for a push.
# - on main, always everything, before the app and the database are updated
#   (deploy.yml and database.yml wait for this workflow).
# Pushes to other branches start nothing: the pull request runs the checks.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request stops the older run. Runs on main are never
# stopped: each commit on main has a group of its own.
concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # One job, so a push costs about 2 minutes rather than 4: the local
    # database starts in the background while lint, type checks and the unit
    # tests run (GitHub rounds each job up to a whole minute).
    name: Lint, type checks, tests and the database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up pnpm (the version in package.json)
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0, 13 Mar 2026: runs on Node 24

      - name: Set up Node (the version in .node-version)
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Set up the Supabase command line (2.122.0, ARCHITECTURE.md 1.2)
        run: npm install --global supabase@2.122.0

      - name: Start a local database with every migration and the test helpers, in the background
        # The database tests and step 3b's sign-in rules need only the
        # database and sign-in. Nothing here reaches the real project; the
        # Database workflow does that, from main only (D297).
        run: |
          nohup bash -c 'supabase start --exclude kong,postgrest,postgres-meta,imgproxy,supavisor,studio,mailpit,realtime,storage-api,edge-runtime,logflare,vector \
            > "$RUNNER_TEMP/supabase-start.log" 2>&1; echo $? > "$RUNNER_TEMP/supabase-start.exit"' > /dev/null 2>&1 &

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Lint
        run: pnpm lint

      - name: Type checks
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Wait for the local database
        timeout-minutes: 10
        run: |
          until [ -f "$RUNNER_TEMP/supabase-start.exit" ]; do sleep 2; done
          cat "$RUNNER_TEMP/supabase-start.log"
          exit "$(cat "$RUNNER_TEMP/supabase-start.exit")"

      - name: Database tests (pgTAP)
        run: supabase test db

      - name: Check the database's own functions for mistakes
        run: supabase db lint --level warning --fail-on warning

  end-to-end:
    # Drafts skip these. On main and on a pull request that's ready, they run
    # on every push; a newer push stops the older ones, here or in ready.yml.
    name: End-to-end
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    concurrency:
      group: end-to-end-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/end-to-end.yml
