name: Check

# Lint, type checks and unit tests, then the app's build and the end-to-end
# tests on phone-sized screens, on every push and pull request (brief 7.1).

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up pnpm (the version in package.json)
        uses: pnpm/action-setup@v4

      - name: Set up Node (the version in .node-version)
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Lint
        run: pnpm lint

      - name: Type checks
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

  database:
    # The database and its privacy rules (step 3a, D297): every migration in
    # supabase/migrations applied to a fresh local Supabase on GitHub's
    # machine, then the pgTAP tests in supabase/tests. Nothing here reaches
    # the real project; the Database workflow does that, from main only.
    name: Database and its privacy rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node (the version in .node-version)
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          # This job doesn't use pnpm, so nothing of pnpm's to keep.
          package-manager-cache: false

      - name: Set up the Supabase command line (2.122.0, ARCHITECTURE.md 1.2)
        run: npm install --global supabase@2.122.0

      - name: Start a local database with every migration and the test helpers
        # Only the database and sign-in are needed for the tests.
        run: supabase start --exclude kong,postgrest,postgres-meta,imgproxy,supavisor

      - name: Database tests (pgTAP)
        run: supabase test db

      - name: Check the database's own functions for mistakes
        run: supabase db lint --level warning --fail-on warning

  end-to-end:
    # In three parts side by side, so the whole set, with a journey for each
    # of the six people (step 2h), stays well inside the time limit.
    name: Build and end-to-end tests (part ${{ matrix.part }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up pnpm (the version in package.json)
        uses: pnpm/action-setup@v4

      - name: Set up Node (the version in .node-version)
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build the app
        run: pnpm build

      - name: Install the test browser
        run: pnpm --filter @prepenny/web exec playwright install --with-deps chromium

      - name: End-to-end tests at 320px and 360px
        run: pnpm --filter @prepenny/web exec playwright test --shard=${{ matrix.part }}/3

      - name: Keep the test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-part-${{ matrix.part }}
          path: apps/web/playwright-report
          retention-days: 7
