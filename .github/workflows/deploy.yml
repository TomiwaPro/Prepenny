name: Deploy

# Puts the app online with Cloudflare Workers (D68):
# - the live app, from main, only after the Check workflow has passed on it,
#   with the real Supabase project
# - a preview link for every pull request, posted on it, with the preview
#   Supabase project, which never holds real people's data (step 3e-2, D403):
#   the pull request's database changes, sign-in settings and get-back-in
#   function go there first, then the preview is tried on two phones.
# Needs two secrets, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID: see
# "Putting PrePenny online" in README.md. Until they're added, it builds the
# app and says plainly that nothing was put online. Previews also need the
# preview project's three secrets and two variables ("The preview database").
# A preview never gets the real project's key, password or address.

on:
  workflow_run:
    workflows: [Check]
    types: [completed]
    branches: [main]
  # A preview once a pull request is ready for review, and after every push
  # from then on. Drafts get none, to save GitHub's minutes (D300).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# A newer push to a pull request stops its older preview. The live app is
# never stopped half way: one goes online at a time, in order.
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # bash -eo pipefail: a failing command fails its step, even inside a pipe.
    shell: bash

jobs:
  deploy:
    name: Put the app online
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The live app only from main once its checks have passed, or by hand from
    # main. Previews only for pull requests from this repository, because
    # other people's copies never get the secrets.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false)
    env:
      WRANGLER_SEND_METRICS: "false"
    # The preview's address, for the preview database's sign-in settings and the try on two phones.
    outputs:
      url: ${{ steps.preview.outputs.url }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v5
        with:
          # For the live app, exactly the commit the checks passed on.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up pnpm (the version in package.json)
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0, 13 Mar 2026: runs on Node 24

      - name: Set up Node (the version in .node-version)
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Build the app
        # The live app uses the real Supabase project, for signing in (step
        # 3b); a pull request's preview uses the preview project only, and
        # says on every page it's a test version (step 3e-2, D403). All four
        # are public: they're in the app every phone downloads. Until a pair
        # is added (README.md), that version is built with signing in
        # switched off, and says so. A preview never falls back to the real one.
        env:
          IS_PREVIEW: ${{ github.event_name == 'pull_request' }}
          LIVE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          LIVE_SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          PREVIEW_SUPABASE_URL: ${{ vars.PREVIEW_SUPABASE_URL }}
          PREVIEW_SUPABASE_KEY: ${{ vars.PREVIEW_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ "$IS_PREVIEW" = "true" ]; then
            export NEXT_PUBLIC_PREVIEW=true
            if [ -z "$PREVIEW_SUPABASE_URL" ] || [ -z "$PREVIEW_SUPABASE_KEY" ]; then
              echo "::warning title=Signing in is off on this preview::The PREVIEW_SUPABASE_URL and PREVIEW_SUPABASE_PUBLISHABLE_KEY variables aren't set yet, so this preview can't sign anyone in. Follow 'The preview database' in README.md."
              export NEXT_PUBLIC_SUPABASE_URL='' NEXT_PUBLIC_SUPABASE_KEY=''
            elif [ "$PREVIEW_SUPABASE_URL" = "$LIVE_SUPABASE_URL" ] || [ "$PREVIEW_SUPABASE_KEY" = "$LIVE_SUPABASE_KEY" ]; then
              echo "::error title=Preview not built::PREVIEW_SUPABASE_URL or PREVIEW_SUPABASE_PUBLISHABLE_KEY is the real project's. A preview never uses the real project: copy them from the prepenny-preview project (README.md, 'The preview database')."
              exit 1
            else
              export NEXT_PUBLIC_SUPABASE_URL="$PREVIEW_SUPABASE_URL" NEXT_PUBLIC_SUPABASE_KEY="$PREVIEW_SUPABASE_KEY"
            fi
          else
            if [ -z "$LIVE_SUPABASE_URL" ] || [ -z "$LIVE_SUPABASE_KEY" ]; then
              echo "::warning title=Signing in is off::The SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY variables aren't set yet, so this version can't sign anyone in. Follow 'Signing in' in README.md."
            fi
            export NEXT_PUBLIC_SUPABASE_URL="$LIVE_SUPABASE_URL" NEXT_PUBLIC_SUPABASE_KEY="$LIVE_SUPABASE_KEY"
          fi
          pnpm build

      - name: Check Cloudflare is set up
        id: cloudflare
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::warning title=Not put online::Cloudflare isn't set up yet, so nothing was put online. Follow 'Putting PrePenny online' in README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Put the live app online
        if: steps.cloudflare.outputs.ready == 'true' && github.event_name != 'pull_request'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: pnpm exec wrangler deploy --message "Commit ${COMMIT::7}"

      - name: Upload a preview of this pull request
        id: preview
        if: steps.cloudflare.outputs.ready == 'true' && github.event_name == 'pull_request'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NUMBER: ${{ github.event.number }}
        run: |
          # A preview needs the live app to exist on Cloudflare. A preview is
          # never put online as the live app, even the very first time, since
          # step 3e-2: it's built with the preview database and says it's a
          # test version (D409). Any problem stops here with Cloudflare's message.
          if ! pnpm exec wrangler deployments list > deployments.log 2>&1; then
            cat deployments.log
            if grep -q "10007" deployments.log; then
              echo "::error title=No live app yet::The live app isn't on Cloudflare yet, so there's nothing to make a preview of. Put main online first: Actions, then Deploy, then Run workflow, keeping Branch: main."
            else
              echo "::error title=Cloudflare refused::Cloudflare couldn't list the app's versions. Its message is above."
            fi
            exit 1
          fi
          pnpm exec wrangler versions upload --preview-alias "pr-$NUMBER" --message "Pull request $NUMBER" | tee upload.log
          url=$(grep -oE "https://pr-$NUMBER-[a-z0-9.-]+\.workers\.dev" upload.log | head -n 1 || true)
          if [ -z "$url" ]; then
            echo "::error title=No preview link::Cloudflare didn't give a preview link. Its message is above."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Post the preview link on the pull request
        # Straight away, so a preview waiting its turn for the preview
        # database still has its link. The next job updates this comment (D405).
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.number }}
          URL: ${{ steps.preview.outputs.url }}
        run: |
          body="Preview of this pull request: $URL/app/

          Its test database is being got ready. This comment changes when it's done, in a few minutes."
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --body "$body" \
            || gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"

  preview:
    # Step 3e-2 (D403 to D408): the pull request's database changes, its
    # sign-in settings and the get-back-in function go to the preview
    # Supabase project, which never holds real people's data; then the
    # preview just put online is tried on two phones, and its link is posted.
    # Only ever the preview project: this job is never given the real
    # project's key, password or Project ID, and it stops unless the project
    # it's given is called prepenny-preview.
    name: Get the preview database ready, and try the preview
    needs: deploy
    if: github.event_name == 'pull_request' && needs.deploy.outputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # One preview at a time changes the preview database, in turn, and is
    # tried on it before the next starts (D405).
    concurrency:
      group: preview-database
      cancel-in-progress: false
    env:
      PREVIEW_URL: ${{ needs.deploy.outputs.url }}
      NUMBER: ${{ github.event.number }}
      PREVIEW_SUPABASE_URL: ${{ vars.PREVIEW_SUPABASE_URL }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node (the version in .node-version)
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Check the preview project is set up
        id: supabase
        env:
          HAS_TOKEN: ${{ secrets.PREVIEW_SUPABASE_ACCESS_TOKEN != '' }}
          HAS_REF: ${{ secrets.PREVIEW_SUPABASE_PROJECT_REF != '' }}
          HAS_PASSWORD: ${{ secrets.PREVIEW_SUPABASE_DB_PASSWORD != '' }}
          HAS_KEY: ${{ vars.PREVIEW_SUPABASE_PUBLISHABLE_KEY != '' }}
        run: |
          missing=()
          [ "$HAS_TOKEN" = "true" ] || missing+=("the secret PREVIEW_SUPABASE_ACCESS_TOKEN")
          [ "$HAS_REF" = "true" ] || missing+=("the secret PREVIEW_SUPABASE_PROJECT_REF")
          [ "$HAS_PASSWORD" = "true" ] || missing+=("the secret PREVIEW_SUPABASE_DB_PASSWORD")
          [ -n "$PREVIEW_SUPABASE_URL" ] || missing+=("the variable PREVIEW_SUPABASE_URL")
          [ "$HAS_KEY" = "true" ] || missing+=("the variable PREVIEW_SUPABASE_PUBLISHABLE_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            list=$(printf '%s, ' "${missing[@]}"); list=${list%, }
            echo "::warning title=Preview database not set up::The preview database isn't set up yet, so nothing was changed on it. Missing: $list. Follow 'The preview database' in README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check it's the preview project, never the real one
        # Before Supabase is asked anything about it: starting the preview
        # database again empties it (D405). Its address must be the one the
        # preview app is built with, and never the real project's.
        if: steps.supabase.outputs.ready == 'true'
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.PREVIEW_SUPABASE_PROJECT_REF }}
          REAL_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: |
          if [ "$PREVIEW_SUPABASE_URL" != "https://$SUPABASE_PROJECT_REF.supabase.co" ]; then
            echo "::error title=Preview address::PREVIEW_SUPABASE_PROJECT_REF and PREVIEW_SUPABASE_URL aren't the same project's (the address is https://<its Project ID>.supabase.co), so nothing was changed. Copy both again from the prepenny-preview project (README.md, 'The preview database', steps 3 and 4)."
            exit 1
          fi
          if [ "$PREVIEW_SUPABASE_URL" = "$REAL_SUPABASE_URL" ]; then
            echo "::error title=Not the preview project::PREVIEW_SUPABASE_PROJECT_REF is the real project's, so nothing was changed. Put prepenny-preview's Project ID in it (README.md, 'The preview database', step 3)."
            exit 1
          fi
          echo "It isn't the real project."

      - name: Check the preview key has every permission this run needs, before anything changes
        # The same check as the Database workflow's (D406), on the preview
        # key, which first checks the project is called prepenny-preview, and
        # stops before trying anything else on it if it isn't.
        id: key
        if: steps.supabase.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PREVIEW_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.PREVIEW_SUPABASE_PROJECT_REF }}
          KEY_NAME: PREVIEW_SUPABASE_ACCESS_TOKEN
          PROJECT_NAME: prepenny-preview
          EXPECT_PROJECT_NAME: prepenny-preview
          README_PART: '"The preview database", steps 6 to 8'
        run: node scripts/check-supabase-key.ts

      - name: Set up the Supabase command line (2.122.0, as in the Check workflow)
        if: steps.supabase.outputs.ready == 'true'
        run: npm install --global supabase@2.122.0

      - name: Connect to the preview project
        if: steps.supabase.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PREVIEW_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.PREVIEW_SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PREVIEW_SUPABASE_DB_PASSWORD }}
        run: |
          if ! supabase link --project-ref "$SUPABASE_PROJECT_REF"; then
            echo "::error title=Couldn't reach the preview database::Check PREVIEW_SUPABASE_DB_PASSWORD (README.md, 'The preview database'). A free project pauses after a week without use: open prepenny-preview on supabase.com and tap Restore project, then run this again."
            exit 1
          fi

      - name: Look at what the preview database has
        # Its database changes, their fingerprints and the pull request it
        # follows, then what to do: nothing, add this pull request's new
        # changes, or start again with exactly this pull request's (D405).
        id: has
        if: steps.supabase.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PREVIEW_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.PREVIEW_SUPABASE_PROJECT_REF }}
        run: |
          query() {
            local status
            status=$(jq -n --arg query "$1" '{query: $query}' | curl --silent --show-error \
              --output "$RUNNER_TEMP/answer.json" --write-out '%{http_code}' --request POST \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header "Content-Type: application/json" --data @-)
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "::error title=Preview database::Supabase answered $status when asked what the preview database has." >&2
              exit 1
            fi
            cat "$RUNNER_TEMP/answer.json"
          }
          there=$(query "select to_regclass('supabase_migrations.schema_migrations') is not null as applied, to_regclass('preview.migrations') is not null as fingerprints, to_regclass('preview.pull_requests') is not null as sharing")
          applied='[]'; fingerprints='[]'; others=''
          if [ "$(jq -r '.[0].applied' <<< "$there")" = "true" ]; then
            applied=$(query "select coalesce(jsonb_agg(version order by version), '[]'::jsonb) as v from supabase_migrations.schema_migrations" | jq -c '.[0].v')
          fi
          if [ "$(jq -r '.[0].fingerprints' <<< "$there")" = "true" ]; then
            fingerprints=$(query "select coalesce(jsonb_agg(jsonb_build_object('version', version, 'sha256', sha256)), '[]'::jsonb) as v from preview.migrations" | jq -c '.[0].v')
          fi
          if [ "$(jq -r '.[0].sharing' <<< "$there")" = "true" ]; then
            others=$(query "select coalesce(string_agg(pull_request::text, ' ' order by pull_request), '') as v from preview.pull_requests where pull_request <> $NUMBER" | jq -r '.[0].v')
          fi
          decision=$(node scripts/preview-database.ts decide "$(jq -nc --argjson a "$applied" --argjson f "$fingerprints" '{applied: $a, fingerprints: $f}')")
          echo "$(jq -r '.why' <<< "$decision")"
          {
            echo "action=$(jq -r '.action' <<< "$decision")"
            echo "why=$(jq -r '.why' <<< "$decision")"
            echo "others=$others"
          } >> "$GITHUB_OUTPUT"

      - name: Give the preview database this pull request's database changes
        if: steps.supabase.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PREVIEW_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.PREVIEW_SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PREVIEW_SUPABASE_DB_PASSWORD }}
          ACTION: ${{ steps.has.outputs.action }}
        run: |
          case "$ACTION" in
            nothing) echo "Nothing to change." ;;
            add)
              supabase db push --linked --dry-run
              supabase db push --linked ;;
            start-again)
              # Empties the preview database, test accounts too, and gives it
              # exactly this pull request's database changes. Never the seed:
              # the tests' made-up people stay on GitHub's own machine.
              supabase db reset --linked --no-seed --yes ;;
            *) echo "::error title=Preview database::No decision was made."; exit 1 ;;
          esac
          changed=$([ "$ACTION" = "nothing" ] && echo false || echo true)
          sql=$(node scripts/preview-database.ts record "$NUMBER" "$changed")
          status=$(jq -n --arg query "$sql" '{query: $query}' | curl --silent --show-error \
            --output "$RUNNER_TEMP/answer.json" --write-out '%{http_code}' --request POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header "Content-Type: application/json" --data @-)
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error title=Preview database::Supabase answered $status when the preview database's fingerprints were noted."
            exit 1
          fi
          echo "The preview database has this pull request's database changes."

      - name: Put the get-back-in function online on the preview project
        # As the Database workflow does on the real project (step 3e hardening).
        if: steps.supabase.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PREVIEW_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.PREVIEW_SUPABASE_PROJECT_REF }}
        run: supabase functions deploy get-back-in --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api

      - name: Check the preview's Data API shows PrePenny's public part only
        # As the Database workflow does on the real project (D341).
        if: steps.supabase.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PREVIEW_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.PREVIEW_SUPABASE_PROJECT_REF }}
        run: |
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/data-api.json" --write-out '%{http_code}' \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/postgrest" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error title=Data API settings::Supabase answered $status when asked for them: $(jq -r '.message // .msg // "no message"' "$RUNNER_TEMP/data-api.json")"
            exit 1
          fi
          schemas=$(jq -r '.db_schema' "$RUNNER_TEMP/data-api.json")
          echo "The preview's Data API shows: $schemas"
          if tr ',' '\n' <<< "$schemas" | tr -d ' ' | grep -qx 'app'; then
            echo "::error title=The preview's Data API shows app::Take it off by hand: on supabase.com open prepenny-preview, then Project Settings, Data API, and under Exposed schemas remove app, keeping public and graphql_public. Then run this again."
            exit 1
          fi
          if ! tr ',' '\n' <<< "$schemas" | tr -d ' ' | grep -qx 'public'; then
            echo "::warning title=Data API settings::public isn't on the preview's Data API list, so the preview can't save plans. On supabase.com, prepenny-preview: Project Settings, Data API, Exposed schemas: add public."
          fi

      - name: Set the preview's sign-in settings
        # The real project's settings (supabase/sign-in-settings.json), but
        # the sign-in email's link opens this preview, only previews may be
        # sent back to, the emails say they're from a test version, and
        # Google stays off: its sign-in is set up for the real project only.
        if: steps.supabase.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PREVIEW_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.PREVIEW_SUPABASE_PROJECT_REF }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          host=${PREVIEW_URL#https://}
          others="https://*-${host#pr-"$NUMBER"-}/**"
          settings=$(jq --rawfile email supabase/templates/sign-in-code.html \
            --rawfile change supabase/templates/email-change.html \
            --arg site "$PREVIEW_URL" --arg others "$others" \
            '. + {site_url: $site, uri_allow_list: $others, external_google_enabled: false,
              mailer_templates_confirmation_content: $email, mailer_templates_magic_link_content: $email,
              mailer_templates_email_change_content: $change}' \
            supabase/sign-in-settings.json)
          if [ -n "$RESEND_API_KEY" ]; then
            settings=$(jq --arg key "$RESEND_API_KEY" '. + {smtp_host: "smtp.resend.com", smtp_port: "465",
              smtp_user: "resend", smtp_pass: $key, smtp_admin_email: "hello@prepenny.co.uk",
              smtp_sender_name: "PrePenny (test version)", smtp_max_frequency: 60, rate_limit_email_sent: 30}' <<< "$settings")
          else
            echo "::warning title=Sign-in emails::RESEND_API_KEY isn't set, so Supabase's own test sender sends the preview's sign-in emails, only to its team."
          fi
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/answer.json" --write-out '%{http_code}' \
            --request PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header "Content-Type: application/json" \
            --data @- <<< "$settings")
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error title=Sign-in settings refused::Supabase answered $status: $(jq -r '.message // .msg // "no message"' "$RUNNER_TEMP/answer.json")"
            exit 1
          fi
          echo "The preview's sign-in settings are set, with links to $PREVIEW_URL."

      - name: Let the preview database send PrePenny's own emails
        # Through Resend with the key GitHub already has (the owner's
        # instruction), from "PrePenny (test version)", with its links to
        # this preview.
        if: steps.supabase.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PREVIEW_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.PREVIEW_SUPABASE_PROJECT_REF }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::warning title=Backup emails::RESEND_API_KEY isn't set, so backup emails can't be added or used on previews."
            exit 0
          fi
          if ! [[ "$RESEND_API_KEY" =~ ^re_[A-Za-z0-9_]+$ ]]; then
            echo "::error title=Backup emails::RESEND_API_KEY doesn't look like a Resend key (it starts with re_). Check it in GitHub's secrets."
            exit 1
          fi
          # The key goes as a value beside the query, never written into it,
          # so no log of the query's words holds it.
          send() {
            curl --silent --show-error --output "$RUNNER_TEMP/answer.json" --write-out '%{http_code}' --request POST \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header "Content-Type: application/json" --data @-
          }
          status=$(jq -n --arg key "$RESEND_API_KEY" '{query: "select app.use_resend($1)", parameters: [$key]}' | send)
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error title=Backup emails::Supabase answered $status when the preview database was given the Resend key: $(jq -r '.message // .msg // "no message"' "$RUNNER_TEMP/answer.json" | grep -v re_ || true)"
            exit 1
          fi
          # The preview's address is from Cloudflare's own answer, letters, digits, dots and dashes only.
          query="update app.email_sender set site = '$PREVIEW_URL', from_name = 'PrePenny (test version)'"
          status=$(jq -n --arg query "$query" '{query: $query}' | send)
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error title=Backup emails::Supabase answered $status when the preview database was told the preview's address."
            exit 1
          fi
          echo "The preview's own emails go through Resend, with links to $PREVIEW_URL."

      - name: Set up pnpm (the version in package.json)
        if: steps.supabase.outputs.ready == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0, 13 Mar 2026: runs on Node 24

      - name: Install
        if: steps.supabase.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Find the test browser's version
        id: playwright
        if: steps.supabase.outputs.ready == 'true'
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Bring back the test browser kept from an earlier run
        id: browser
        if: steps.supabase.outputs.ready == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0, 26 Jun 2026: runs on Node 24
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-chromium-shell-${{ runner.os }}-${{ runner.arch }}

      - name: Download the test browser (only when it isn't kept yet)
        if: steps.supabase.outputs.ready == 'true' && steps.browser.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: pnpm --filter @prepenny/web exec playwright install --only-shell chromium

      - name: Try the preview on two phones, on the preview project only
        # Signs in, saves a plan and keeps it in step on two phones, and
        # checks neither phone asks the real project anything and the live
        # app hasn't changed (apps/web/e2e/preview.spec.ts, D408). Signing in
        # uses links the preview project makes with its own secret key, read
        # here and never printed, so no email is sent.
        id: tried
        if: steps.supabase.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PREVIEW_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.PREVIEW_SUPABASE_PROJECT_REF }}
          REAL_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          LIVE_SITE: https://prepenny.co.uk
        run: |
          curl --silent --show-error --fail --output "$RUNNER_TEMP/keys.json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          secret=$(jq -r '(map(select(.type == "secret" and (.api_key // "") != "")) + map(select(.name == "service_role" and (.api_key // "") != "")))[0].api_key // empty' "$RUNNER_TEMP/keys.json")
          rm -f "$RUNNER_TEMP/keys.json"
          if [ -z "$secret" ]; then
            echo "::error title=Preview not tried::The preview project has no secret key to make sign-in links with."
            exit 1
          fi
          echo "::add-mask::$secret"
          # The tests get the preview's secret key for sign-in links, never the Supabase key.
          env -u SUPABASE_ACCESS_TOKEN -u SUPABASE_PROJECT_REF PREVIEW_SECRET_KEY="$secret" \
            pnpm --filter @prepenny/web exec playwright test --project=preview --reporter=list,html

      - name: Remove the try's test accounts from the preview database
        # Only on the project the checks passed: never on any other.
        if: always() && steps.key.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PREVIEW_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.PREVIEW_SUPABASE_PROJECT_REF }}
        run: |
          query="delete from public.plans where owner in (select id from auth.users where email like 'preview-check-%@example.com'); delete from auth.users where email like 'preview-check-%@example.com';"
          jq -n --arg query "$query" '{query: $query}' | curl --silent --show-error --output /dev/null --request POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" --header "Content-Type: application/json" --data @- || true

      - name: Keep the test report when the try fails
        if: failure() && steps.tried.outcome == 'failure'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, 12 Dec 2025: runs on Node 24
        with:
          name: playwright-report-preview
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: Post the preview link on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          READY: ${{ steps.supabase.outputs.ready }}
          OUTCOME: ${{ job.status }}
          WHY: ${{ steps.has.outputs.why }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$READY" != "true" ]; then
            more="The preview database isn't set up yet, so it wasn't got ready and signing in may not work on this preview. Follow 'The preview database' in README.md."
          elif [ "$OUTCOME" = "success" ]; then
            more="It has its own test database, never the real one: don't use real details. Sign in with any email address you can read, typing the 6-digit code from the email: the email's link opens whichever preview was put online last. $WHY It was tried on two phones: signed in, saved a plan and kept it in step."
          else
            more="The preview database couldn't be got ready, or the try on two phones didn't pass, so signing in may not work on this preview. The Deploy run says why: $RUN"
          fi
          body="Preview of this pull request: $PREVIEW_URL/app/

          $more

          Open it on your phone to try it. It updates with every new commit."
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --body "$body" \
            || gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Tell the other pull requests whose previews no longer match the preview database
        # Their previews now say "Changes can't be sent right now", and
        # nothing on a phone is lost; each is tried again from its next
        # commit, or by running its Deploy again (D405).
        if: always() && steps.has.outputs.action != 'nothing' && steps.has.outputs.others != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OTHERS: ${{ steps.has.outputs.others }}
        run: |
          for other in $OTHERS; do
            if [ "$(gh pr view "$other" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" != "OPEN" ]; then
              continue
            fi
            gh pr comment "$other" --repo "$GITHUB_REPOSITORY" --body "The preview database now has pull request #$NUMBER's database changes, so this pull request's preview can't send changes for now: it says \"Changes can't be sent right now.\" Nothing on a phone is lost. To try this one again, open Actions, then Deploy, then this pull request's newest run, and tap Re-run all jobs."
          done
